name: Release

# Builds the launcher and attaches it to a GitHub Release. Doing it here rather
# than uploading a hand-built exe means the published binary is always
# reproducibly tied to a specific commit, and nobody has to remember the
# publish flags.
#
# Two ways a release happens:
#
#   SIGNED (when the SIGNPATH_API_TOKEN secret exists):
#     git tag v0.3.0 && git push origin v0.3.0
#   The tag is built, signed through SignPath, verified, and published.
#
#   UNSIGNED, on purpose (no signing available yet):
#     Actions → Release → Run workflow → tick publish_unsigned
#   The tag is v<Version> from Paladin.Launcher.csproj (the optional tag box
#   must agree with it), created at this commit. A person chooses it, and the
#   release notes carry the SmartScreen warning. A PUSHED tag without the
#   secret is still refused, so an unsigned binary never reaches the release
#   page by accident — Windows Smart App Control blocks unsigned files outright
#   on some machines, with no user override. Plain `workflow_dispatch` runs
#   (publish_unsigned left unticked) only build an unsigned artifact for testing.
#
# Needed once, when a signing service accepts the project:
#   secret  SIGNPATH_API_TOKEN        (a SignPath CI user's API token)
#   variable SIGNPATH_ORGANIZATION_ID (from the SignPath organization page)
#   and in SignPath: project slug "paladin-replay-launcher", signing policy
#   "release-signing", an artifact configuration for one exe with product-name
#   and version metadata restrictions matching Paladin.Launcher.csproj.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_unsigned:
        description: "Publish an UNSIGNED release (SmartScreen warns, Smart App Control blocks). Deliberate use only."
        type: boolean
        default: false
      tag:
        description: "Optional. Leave empty to release v<Version> from the csproj; if given it must match that version."
        type: string
        default: ""

permissions:
  contents: write

env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
  # The boolean input arrives as a boolean or, on some paths, the string 'true'; accept both.
  UNSIGNED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_unsigned == true || inputs.publish_unsigned == 'true') }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Say up front which path this run takes and settle the release tag, so
      # a manual run meant to publish can never pass quietly as a test build,
      # and a release can never carry a version other than the csproj's.
      - name: What this run will do
        shell: pwsh
        run: |
          $isTag = "${{ env.IS_TAG }}" -eq "true"
          $unsigned = "${{ env.UNSIGNED_RELEASE }}" -eq "true"
          $csproj = Get-Content src/Paladin.Launcher/Paladin.Launcher.csproj -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') { Write-Error "No <Version> in the csproj"; exit 1 }
          $version = $Matches[1]
          $releaseTag = ""
          if ($isTag) {
            $releaseTag = "${{ github.ref_name }}"
            $line = "SIGNED release of pushed tag $releaseTag (csproj version $version)"
          } elseif ($unsigned) {
            $given = "${{ inputs.tag }}".Trim()
            $releaseTag = if ($given) { $given } else { "v$version" }
            if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "Tag '$releaseTag' is not of the form vX.Y.Z"; exit 1 }
            if ($releaseTag -ne "v$version") { Write-Error "Tag '$releaseTag' does not match the csproj version '$version' — change one of them"; exit 1 }
            $line = "UNSIGNED release of $releaseTag (publish_unsigned ticked; tag from " + $(if ($given) { "the tag box" } else { "the csproj" }) + ")"
          } else {
            $line = "TEST BUILD ONLY - no release (publish_unsigned not ticked)"
          }
          Write-Host $line
          "### $line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build --configuration Release --nologo

      # The suite has no package dependencies, so it runs anywhere the SDK does.
      - name: Test
        run: dotnet run --project tests/Paladin.Tests --configuration Release --no-build

      # Single-file self-contained is required, not merely convenient: a split
      # build leaves an unsigned PaladinReplayLauncher.dll beside the exe, which
      # Windows Smart App Control blocks with 0x800711C7 on some machines.
      - name: Publish
        run: >
          dotnet publish src/Paladin.Launcher/Paladin.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          --output ./release
          --nologo

      # ---------- signing (pushed tags only) ----------
      - name: Refuse to release unsigned
        if: env.IS_TAG == 'true' && env.SIGNPATH_API_TOKEN == ''
        shell: pwsh
        run: |
          Write-Error "SIGNPATH_API_TOKEN is not set: a pushed release tag must be signed. Add the secret (and the SIGNPATH_ORGANIZATION_ID variable) when a signing service has accepted the project, or publish deliberately unsigned with 'Run workflow' (publish_unsigned ticked)."
          exit 1

      # SignPath signs a GitHub artifact, not a loose file: upload the unsigned
      # exe, hand its artifact id over, and get the signed copy back.
      - name: Upload unsigned build for signing
        id: upload-unsigned
        if: env.IS_TAG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PaladinReplayLauncher-unsigned
          path: release/PaladinReplayLauncher.exe
          if-no-files-found: error

      - name: Sign (SignPath Foundation)
        id: sign
        if: env.IS_TAG == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: paladin-replay-launcher
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          # Every OSS signing request needs a person to approve it in SignPath;
          # the job waits up to 30 minutes for that click.
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: release-signed

      - name: Verify the signature and take the signed file
        if: env.IS_TAG == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path release-signed -Recurse -Filter PaladinReplayLauncher.exe | Select-Object -First 1
          if (-not $signed) { Write-Error "SignPath returned no PaladinReplayLauncher.exe"; exit 1 }
          $sig = Get-AuthenticodeSignature $signed.FullName
          Write-Host "Signature status: $($sig.Status) — signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Signature is not valid ($($sig.Status)); refusing to release."; exit 1 }
          Copy-Item $signed.FullName release/PaladinReplayLauncher.exe -Force

      # ---------- deliberate unsigned release ----------
      - name: Unsigned release — say so in the summary
        if: env.UNSIGNED_RELEASE == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature release/PaladinReplayLauncher.exe
          Write-Host "Publishing UNSIGNED $env:RELEASE_TAG (signature status: $($sig.Status))"
          "## Unsigned release $env:RELEASE_TAG`n`nPublished deliberately without a code signature (no signing service yet). SmartScreen will warn; Smart App Control blocks it." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ---------- publish ----------
      - name: Checksum
        shell: pwsh
        run: |
          $exe = "release/PaladinReplayLauncher.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  PaladinReplayLauncher.exe" | Out-File -FilePath release/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256 $hash"
          Write-Host ("{0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

      - uses: softprops/action-gh-release@v2
        if: env.IS_TAG == 'true' || env.UNSIGNED_RELEASE == 'true'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            release/PaladinReplayLauncher.exe
            release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: env.IS_TAG != 'true' && env.UNSIGNED_RELEASE != 'true'
        with:
          name: PaladinReplayLauncher
          path: release/
